<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>モンパーク・ジャーナル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Shippori+Mincho:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1E8D3;
    --paper-deep:#E7DBBE;
    --ink:#2B2418;
    --ink-soft:#5C5138;
    --line:#C9B98C;
    --forest:#3A5A40;
    --forest-dark:#2C4331;
    --amber:#B4772C;
    --fire:#B0492E;
    --water:#356E8C;
    --leaf:#5F8146;
    --normal:#8A7A54;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Shippori Mincho', serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(180,119,44,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(58,90,64,0.08), transparent 40%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:20px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
  }
  header .stamp{
    display:inline-block;
    width:46px;height:46px;
    border:2px solid var(--forest);
    border-radius:50%;
    color:var(--forest);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    line-height:1.1;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);
    margin:0 auto 8px;
  }
  h1{
    font-family:'Zilla Slab',serif;
    font-size:28px;
    letter-spacing:0.04em;
    margin:0 0 4px;
    color:var(--forest-dark);
  }
  .sub{font-size:12px;color:var(--ink-soft);letter-spacing:0.08em;}
  .card{
    background:var(--paper-deep);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 18px;
    margin-bottom:16px;
    box-shadow:0 2px 0 rgba(43,36,24,0.06);
  }
  .card h2{
    font-family:'Zilla Slab',serif;
    font-size:16px;
    margin:0 0 12px;
    color:var(--forest-dark);
    display:flex;align-items:center;gap:8px;
  }
  .card h2::before{content:'';width:8px;height:8px;background:var(--amber);border-radius:50%;display:inline-block;}
  button{
    font-family:'Zilla Slab',serif;
    font-size:14px;
    background:var(--forest);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:10px 16px;
    cursor:pointer;
    letter-spacing:0.03em;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  button:hover{background:var(--forest-dark);}
  button:active{transform:scale(0.97);}
  button.secondary{background:transparent;color:var(--forest-dark);border:1.5px solid var(--forest-dark);}
  button.secondary:hover{background:rgba(58,90,64,0.08);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .mon-card{
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--paper);
    padding:12px 14px;
    margin-bottom:10px;
  }
  .mon-top{display:flex;justify-content:space-between;align-items:center;}
  .mon-name{font-family:'Zilla Slab',serif;font-size:17px;font-weight:600;}
  .type-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    color:#fff;
    display:inline-block;
  }
  .lv{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .hpbar-outer{
    height:8px;background:#00000015;border-radius:4px;overflow:hidden;margin-top:6px;
  }
  .hpbar-inner{height:100%;background:var(--forest);transition:width 0.3s ease;}
  .hpbar-inner.low{background:var(--fire);}
  .statline{
    display:flex;justify-content:space-between;
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);
    margin-top:8px;
  }
  .exp-outer{height:5px;background:#00000012;border-radius:3px;overflow:hidden;margin-top:4px;}
  .exp-inner{height:100%;background:var(--amber);}
  .log{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    line-height:1.7;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    max-height:160px;
    overflow-y:auto;
    color:var(--ink-soft);
  }
  .log div:last-child{color:var(--ink);font-weight:600;}
  .toggle-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
  .switch{
    width:38px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;
  }
  .switch.on{background:var(--forest);}
  .switch .knob{
    width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.15s ease;
  }
  .switch.on .knob{left:20px;}
  .alloc-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 0;border-bottom:1px dashed var(--line);
    font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  .alloc-row:last-child{border-bottom:none;}
  .alloc-btns button{padding:2px 9px;font-size:14px;line-height:1;}
  .footer-note{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:20px;font-family:'JetBrains Mono',monospace;}
  .starter-pick{display:flex;gap:10px;flex-wrap:wrap;}
  .starter-pick .mon-card{flex:1;min-width:150px;cursor:pointer;transition:box-shadow 0.15s ease, transform 0.1s ease;}
  .starter-pick .mon-card:hover{box-shadow:0 3px 10px rgba(43,36,24,0.12);transform:translateY(-2px);}
  .empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:20px 0;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const TYPE_LABEL = {fire:'炎', water:'水', grass:'草', normal:'無'};
const TYPE_COLOR = {fire:'var(--fire)', water:'var(--water)', grass:'var(--leaf)', normal:'var(--normal)'};

const SPECIES = [
  {id:'hinoko', name:'ヒノコ', type:'fire', base:{hp:38,atk:13,def:8,spd:11}, moves:[{name:'ひのこパンチ',power:36},{name:'たいあたり',power:20}]},
  {id:'shizuku', name:'シズク', type:'water', base:{hp:43,atk:9,def:12,spd:8}, moves:[{name:'みずでっぽう',power:32},{name:'たいあたり',power:20}]},
  {id:'leafy', name:'リーフィ', type:'grass', base:{hp:41,atk:10,def:12,spd:9}, moves:[{name:'リーフブレード',power:33},{name:'たいあたり',power:20}]},
  {id:'kotori', name:'コトリ', type:'normal', base:{hp:35,atk:11,def:9,spd:15}, moves:[{name:'つばさアタック',power:29},{name:'たいあたり',power:20}]},
  {id:'ganko', name:'ガンコウ', type:'normal', base:{hp:50,atk:13,def:15,spd:6}, moves:[{name:'いわおとし',power:37},{name:'たいあたり',power:22}]},
  {id:'suisho', name:'スイショウ', type:'water', base:{hp:33,atk:15,def:8,spd:13}, moves:[{name:'あわだんご',power:28},{name:'たいあたり',power:20}]},
];

const STARTER_IDS = ['hinoko','shizuku','leafy'];

function speciesOf(id){ return SPECIES.find(s=>s.id===id); }

function typeMultiplier(atkType, defType){
  const strong = {fire:'grass', grass:'water', water:'fire'};
  const weak = {grass:'fire', water:'grass', fire:'water'};
  if(strong[atkType]===defType) return 1.5;
  if(weak[atkType]===defType) return 0.67;
  return 1.0;
}

function expToNext(level){ return level*15; }

function computeStats(mon){
  const sp = speciesOf(mon.speciesId);
  return {
    maxHp: Math.round(sp.base.hp + mon.level*4 + mon.allocated.hp*3),
    atk: Math.round(sp.base.atk + mon.level*1 + mon.allocated.atk*2),
    def: Math.round(sp.base.def + mon.level*1 + mon.allocated.def*2),
    spd: Math.round(sp.base.spd + mon.level*1 + mon.allocated.spd*2),
  };
}

function newMon(speciesId, level){
  level = level || 5;
  return {
    speciesId, level, exp:0,
    allocated:{hp:0,atk:0,def:0,spd:0},
    points: 0,
  };
}

function makeWild(avgLevel){
  const sp = SPECIES[Math.floor(Math.random()*SPECIES.length)];
  const lvl = Math.max(2, avgLevel + Math.floor(Math.random()*3) - 1);
  return { speciesId: sp.id, level: lvl, allocated:{hp:0,atk:0,def:0,spd:0} };
}

// ---------- state ----------
let state = { started:false, party:[], caughtCount:0 };
let screen = 'home'; // home, starter, allocate, battle
let allocTarget = null;
let battle = null; // {playerIdx, playerHp, wild, wildHp, log:[], auto:false, over:false, result:null}

const STORAGE_KEY = 'monpark_save_v1';

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){ state = JSON.parse(res.value); }
  }catch(e){ /* no save yet */ }
  render();
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('save failed', e); }
}

function pickStarter(id){
  state.started = true;
  state.party = [newMon(id, 5)];
  screen = 'home';
  saveState(); render();
}

function bestMove(atkStats, atkType, moves, defStats, defType){
  let best = moves[0], bestVal = -1;
  moves.forEach(m=>{
    const mult = typeMultiplier(atkType, defType);
    const val = m.power * (atkStats.atk/Math.max(1,defStats.def)) * mult;
    if(val > bestVal){ bestVal = val; best = m; }
  });
  return best;
}

function dealDamage(move, atkStats, atkType, defStats, defType){
  const mult = typeMultiplier(atkType, defType);
  const raw = (move.power * (atkStats.atk / Math.max(1, defStats.def)) * mult) / 4;
  const variance = 0.85 + Math.random()*0.3;
  return Math.max(1, Math.round(raw * variance));
}

function startBattle(partyIdx){
  const mon = state.party[partyIdx];
  const avgLevel = Math.round(state.party.reduce((a,m)=>a+m.level,0)/state.party.length);
  const wild = makeWild(avgLevel);
  const pStats = computeStats(mon);
  const wStats = computeStats(wild);
  battle = {
    partyIdx,
    playerHp: pStats.maxHp,
    playerMax: pStats.maxHp,
    wild, wildHp: wStats.maxHp, wildMax: wStats.maxHp,
    log: [`野生の${speciesOf(wild.speciesId).name}が あらわれた！`],
    auto:false, over:false, result:null,
    expGained:0, leveledUp:false, caught:false,
  };
  screen = 'battle';
  render();
}

function resolveTurn(playerMoveOverride){
  if(!battle || battle.over) return;
  const mon = state.party[battle.partyIdx];
  const pSp = speciesOf(mon.speciesId);
  const pStats = computeStats(mon);
  const wSp = speciesOf(battle.wild.speciesId);
  const wStats = computeStats(battle.wild);

  const pMove = playerMoveOverride || bestMove(pStats, pSp.type, pSp.moves, wStats, wSp.type);
  const wMove = bestMove(wStats, wSp.type, wSp.moves, pStats, pSp.type);

  const order = pStats.spd >= wStats.spd ? ['p','w'] : ['w','p'];
  for(const who of order){
    if(battle.over) break;
    if(who==='p'){
      const dmg = dealDamage(pMove, pStats, pSp.type, wStats, wSp.type);
      battle.wildHp = Math.max(0, battle.wildHp - dmg);
      battle.log.push(`${pSp.name}の${pMove.name}！ ${dmg}のダメージ`);
      if(battle.wildHp<=0){
        battle.over = true; battle.result='win';
        finishBattle(mon, pSp, battle.wild.level);
      }
    } else {
      const dmg = dealDamage(wMove, wStats, wSp.type, pStats, pSp.type);
      battle.playerHp = Math.max(0, battle.playerHp - dmg);
      battle.log.push(`野生の${wSp.name}の${wMove.name}！ ${dmg}のダメージ`);
      if(battle.playerHp<=0){
        battle.over = true; battle.result='lose';
        battle.log.push(`${pSp.name}は たおれた…`);
      }
    }
  }
  render();
}

function finishBattle(mon, pSp, wildLevel){
  const exp = wildLevel*8 + 10;
  battle.expGained = exp;
  mon.exp += exp;
  let leveled = false;
  while(mon.exp >= expToNext(mon.level)){
    mon.exp -= expToNext(mon.level);
    mon.level += 1;
    mon.points += 3;
    leveled = true;
  }
  battle.leveledUp = leveled;
  if(state.party.length < 3 && Math.random() < 0.5){
    battle.caught = true;
    state.party.push(newMon(battle.wild.speciesId, battle.wild.level));
    state.caughtCount += 1;
  }
  battle.log.push(`${pSp.name}は ${exp} けいけんちを かくとく！`);
  if(leveled) battle.log.push(`${pSp.name}は レベルアップ！ Lv.${mon.level}`);
  if(battle.caught) battle.log.push(`野生の${speciesOf(battle.wild.speciesId).name}を なかまにした！`);
  saveState();
}

function toggleAuto(){
  battle.auto = !battle.auto;
  render();
}
function runAutoBattle(){
  let guard = 0;
  while(!battle.over && guard < 50){ resolveTurnSilent(); guard++; }
  render();
}
function resolveTurnSilent(){
  resolveTurn();
}

function exitBattle(){
  battle = null;
  screen = 'home';
  render();
}

function openAllocate(idx){
  allocTarget = idx;
  screen = 'allocate';
  render();
}
function allocPoint(stat, delta){
  const mon = state.party[allocTarget];
  if(delta>0 && mon.points<=0) return;
  if(delta<0 && mon.allocated[stat]<=0) return;
  mon.allocated[stat] += delta;
  mon.points -= delta;
  saveState();
  render();
}
function closeAllocate(){
  screen = 'home';
  render();
}

// ---------- render ----------
function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

function renderMonCard(mon, opts){
  opts = opts || {};
  const sp = speciesOf(mon.speciesId);
  const stats = computeStats(mon);
  const hpPct = opts.hp!=null ? Math.round(100*opts.hp/opts.hpMax) : 100;
  return `
  <div class="mon-card">
    <div class="mon-top">
      <div>
        <span class="mon-name">${sp.name}</span>
        <span class="lv">Lv.${mon.level}</span>
      </div>
      <span class="type-badge" style="background:${TYPE_COLOR[sp.type]}">${TYPE_LABEL[sp.type]}</span>
    </div>
    ${opts.showHp ? `
      <div class="hpbar-outer"><div class="hpbar-inner ${hpPct<30?'low':''}" style="width:${hpPct}%"></div></div>
      <div class="statline"><span>HP</span><span>${opts.hp} / ${opts.hpMax}</span></div>
    ` : `
      <div class="statline"><span>HP ${stats.maxHp}</span><span>攻 ${stats.atk}</span><span>防 ${stats.def}</span><span>速 ${stats.spd}</span></div>
      <div class="exp-outer"><div class="exp-inner" style="width:${Math.round(100*mon.exp/expToNext(mon.level))}%"></div></div>
    `}
    ${opts.footer || ''}
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = `
    <header>
      <div class="stamp">MON<br>PARK</div>
      <h1>モンパーク・ジャーナル</h1>
      <div class="sub">FIELD NOTES — 育成と探索の記録</div>
    </header>
  `;

  if(!state.started){
    html += renderStarterScreen();
  } else if(screen === 'battle' && battle){
    html += renderBattleScreen();
  } else if(screen === 'allocate' && allocTarget!=null){
    html += renderAllocateScreen();
  } else {
    html += renderHomeScreen();
  }

  html += `<div class="footer-note">セーブは自動で行われます — このジャーナル内にのみ保存</div>`;
  app.innerHTML = html;
  bindEvents();
}

function renderStarterScreen(){
  let cards = STARTER_IDS.map(id=>{
    const sp = speciesOf(id);
    return `<div class="mon-card" data-starter="${id}">
      <div class="mon-top">
        <span class="mon-name">${sp.name}</span>
        <span class="type-badge" style="background:${TYPE_COLOR[sp.type]}">${TYPE_LABEL[sp.type]}</span>
      </div>
      <div class="statline"><span>HP ${sp.base.hp}</span><span>攻 ${sp.base.atk}</span><span>防 ${sp.base.def}</span><span>速 ${sp.base.spd}</span></div>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <h2>最初の相棒をえらぶ</h2>
      <div class="starter-pick">${cards}</div>
    </div>
  `;
}

function renderHomeScreen(){
  let cards = state.party.map((mon,i)=>{
    const footer = `<div class="row" style="margin-top:10px">
      <button data-battle="${i}">この子でバトル</button>
      ${mon.points>0 ? `<button class="secondary" data-alloc="${i}">ステータス配分 (${mon.points})</button>` : `<button class="secondary" data-alloc="${i}">ステータス確認</button>`}
    </div>`;
    return renderMonCard(mon, {footer});
  }).join('');
  return `
    <div class="card">
      <h2>手持ちモンスター（${state.party.length}/3）</h2>
      ${cards || `<div class="empty">モンスターがいません</div>`}
    </div>
  `;
}

function renderAllocateScreen(){
  const mon = state.party[allocTarget];
  const sp = speciesOf(mon.speciesId);
  const stats = computeStats(mon);
  const rows = ['hp','atk','def','spd'].map(k=>{
    const label = {hp:'HP',atk:'攻撃',def:'防御',spd:'素早さ'}[k];
    return `<div class="alloc-row">
      <span>${label}（現在値 ${stats[k===  'hp'?'maxHp':k]}）</span>
      <span class="alloc-btns">
        <button class="secondary" data-alloc-minus="${k}">−</button>
        <span style="display:inline-block;width:26px;text-align:center">${mon.allocated[k]}</span>
        <button class="secondary" data-alloc-plus="${k}">＋</button>
      </span>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <h2>${sp.name} のステータス配分</h2>
      <div class="lv" style="margin-bottom:8px">未使用ポイント：${mon.points}</div>
      ${rows}
      <div class="row" style="margin-top:14px">
        <button data-close-alloc="1">もどる</button>
      </div>
    </div>
  `;
}

function renderBattleScreen(){
  const mon = state.party[battle.partyIdx];
  const pSp = speciesOf(mon.speciesId);
  const pStats = computeStats(mon);
  const wSp = speciesOf(battle.wild.speciesId);
  const wStats = computeStats(battle.wild);

  const wildCard = renderMonCard({speciesId:battle.wild.speciesId, level:battle.wild.level, exp:0, allocated:{hp:0,atk:0,def:0,spd:0}}, {showHp:true, hp:battle.wildHp, hpMax:battle.wildMax});
  const playerCard = renderMonCard(mon, {showHp:true, hp:battle.playerHp, hpMax:battle.playerMax});

  let controls = '';
  if(!battle.over){
    controls = `
      <div class="toggle-wrap" style="margin-bottom:10px">
        <div class="switch ${battle.auto?'on':''}" data-toggle-auto="1"><div class="knob"></div></div>
        <span>オート最適化バトル</span>
      </div>
    `;
    if(battle.auto){
      controls += `<div class="row"><button data-run-auto="1">オートで決着まですすめる</button></div>`;
    } else {
      const moves = pSp.moves.map((m,i)=>`<button data-move="${i}">${m.name}（威力${m.power}）</button>`).join('');
      controls += `<div class="row">${moves}</div>`;
    }
  } else {
    const resultText = battle.result==='win' ? 'しょうり！' : 'たいきゃく…';
    controls = `
      <div class="card" style="margin:12px 0 0;background:var(--paper)">
        <h2>${resultText}</h2>
        <div class="lv">獲得けいけんち：${battle.expGained}</div>
        ${battle.leveledUp ? `<div class="lv">レベルアップした！</div>` : ''}
        ${battle.caught ? `<div class="lv">新しいなかまが加わった！</div>` : ''}
      </div>
      <div class="row" style="margin-top:12px"><button data-exit-battle="1">ジャーナルにもどる</button></div>
    `;
  }

  return `
    <div class="card">
      <h2>野生の${wSp.name}</h2>
      ${wildCard}
    </div>
    <div class="card">
      <h2>${pSp.name}（あなたの相棒）</h2>
      ${playerCard}
    </div>
    <div class="card">
      <h2>ログ</h2>
      <div class="log">${battle.log.slice(-8).map(l=>`<div>${l}</div>`).join('')}</div>
    </div>
    ${controls}
  `;
}

function bindEvents(){
  document.querySelectorAll('[data-starter]').forEach(node=>{
    node.addEventListener('click', ()=> pickStarter(node.getAttribute('data-starter')));
  });
  document.querySelectorAll('[data-battle]').forEach(node=>{
    node.addEventListener('click', ()=> startBattle(parseInt(node.getAttribute('data-battle'))));
  });
  document.querySelectorAll('[data-alloc]').forEach(node=>{
    node.addEventListener('click', ()=> openAllocate(parseInt(node.getAttribute('data-alloc'))));
  });
  document.querySelectorAll('[data-close-alloc]').forEach(node=>{
    node.addEventListener('click', closeAllocate);
  });
  document.querySelectorAll('[data-alloc-plus]').forEach(node=>{
    node.addEventListener('click', ()=> allocPoint(node.getAttribute('data-alloc-plus'), 1));
  });
  document.querySelectorAll('[data-alloc-minus]').forEach(node=>{
    node.addEventListener('click', ()=> allocPoint(node.getAttribute('data-alloc-minus'), -1));
  });
  document.querySelectorAll('[data-move]').forEach(node=>{
    node.addEventListener('click', ()=>{
      const mon = state.party[battle.partyIdx];
      const sp = speciesOf(mon.speciesId);
      const move = sp.moves[parseInt(node.getAttribute('data-move'))];
      resolveTurn(move);
    });
  });
  document.querySelectorAll('[data-toggle-auto]').forEach(node=>{
    node.addEventListener('click', toggleAuto);
  });
  document.querySelectorAll('[data-run-auto]').forEach(node=>{
    node.addEventListener('click', runAutoBattle);
  });
  document.querySelectorAll('[data-exit-battle]').forEach(node=>{
    node.addEventListener('click', exitBattle);
  });
}

loadState();
</script>
</body>
</html>
